services:
  poob:
    image: ghcr.io/hacky15/poob:latest
    container_name: poob
    restart: unless-stopped
    env_file: .env
    environment:
      # SCRAPER KILL-SWITCH. The marketplace patrol is OFF — host dedicated to
      # voice/music. To re-enable: set to "true" (or delete this line), then
      # redeploy. Overrides .env. Disabled 2026-06-20 at operator request.
      # See docs/runbooks/scraper-kill-switch.md.
      PATROL_SCHEDULER_AUTO_START: "false"
    # CPU PRIORITY for the real-time voice path on this shared 4-core host.
    # cpu_shares is a relative CFS weight enforced by the kernel *only under
    # contention* — 4x the default (1024) so a co-located deploy build, an
    # ollama fallback, or a co-tenant spike can't starve voice, with zero idle
    # waste. Pairs with the in-process patrol-backoff (scanner yields to voice).
    # poob is deliberately NOT cpu-capped — voice needs to burst.
    # See docs/incidents/voice-cpu-starvation-on-shared-host.md.
    cpu_shares: 4096
    depends_on:
      - ollama
      - searxng
    volumes:
      - poob-data:/app/data
      - poob-browser:/app/browser_profiles
    deploy:
      resources:
        limits:
          memory: 4G

  ollama:
    image: ollama/ollama:latest
    container_name: poob-ollama
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    # Local LLM is CPU-only (50-120s/call) and last-resort only. Hard-cap to 2
    # of 4 cores + a low weight so a stray fallback call can never monopolize
    # the box and starve the voice path during a VC.
    cpu_shares: 256
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 10G

  searxng:
    image: searxng/searxng:latest
    container_name: poob-searxng
    restart: unless-stopped
    volumes:
      - ../docker/searxng:/etc/searxng
    ports:
      - "8080:8080"
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  poob-data:
  poob-browser:
  ollama-data:
