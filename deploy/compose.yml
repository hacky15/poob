services:
  poob:
    image: ghcr.io/hacky15/poob:latest
    container_name: poob
    restart: unless-stopped
    env_file: .env
    depends_on:
      - ollama
      - searxng
    volumes:
      - poob-data:/app/data
      - poob-browser:/app/browser_profiles
    deploy:
      resources:
        limits:
          memory: 4G

  ollama:
    image: ollama/ollama:latest
    container_name: poob-ollama
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    deploy:
      resources:
        limits:
          memory: 10G

  searxng:
    image: searxng/searxng:latest
    container_name: poob-searxng
    restart: unless-stopped
    volumes:
      - ../docker/searxng:/etc/searxng
    ports:
      - "8080:8080"
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  poob-data:
  poob-browser:
  ollama-data:
