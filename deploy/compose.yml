services:
  poob:
    image: ghcr.io/hacky15/poob:latest
    container_name: poob
    restart: unless-stopped
    env_file: .env
    environment:
      # SCRAPER KILL-SWITCH. The marketplace patrol is OFF — host dedicated to
      # voice/music. To re-enable: set to "true" (or delete this line), then
      # redeploy. Overrides .env. Disabled 2026-06-20 at operator request.
      # See docs/runbooks/scraper-kill-switch.md.
      PATROL_SCHEDULER_AUTO_START: "false"
    # CPU PRIORITY for the real-time voice path on this shared 4-core host.
    # poob is DELIBERATELY left with NO cpuset restriction — it's free to
    # burst across all 4 cores whenever nothing else needs them (poob rarely
    # runs hard; capping it would trade away capacity it's almost never
    # contending for). The guarantee instead comes from fencing the KNOWN
    # heavy background contenders OUT of a reserved zone (see the `ollama`
    # service's cpuset below) plus a high cpu_shares weight for whatever
    # contention happens on the cores poob does share with them.
    #
    # 2026-07-07: a previously-unknown, uncapped local-LLM stack (unrelated
    # to this repo) burst to 300%+ CPU and starved poob's Discord gateway
    # heartbeat (WS 1006 / "stopped responding to the gateway", voice torn
    # down) even with cpu_shares:4096 already in place — weight bounds the
    # long-run CPU-time split, not worst-case scheduling latency, so a big
    # enough burst from ANY contender can still stall a single real-time
    # event-loop thread. An earlier version of this fix cpuset-capped poob
    # itself to 2 cores to guarantee isolation — correctly flagged by the
    # operator as trading away capacity poob almost never needs for a
    # guarantee achievable without that cost: fence the NEIGHBORS out of a
    # zone instead of fencing poob INTO one. Same worst-case protection,
    # zero capacity lost in the (overwhelmingly common) uncontended case.
    # See docs/incidents/voice-cpu-starvation-on-shared-host.md.
    cpu_shares: 4096
    depends_on:
      - ollama
      - searxng
    volumes:
      - poob-data:/app/data
      - poob-browser:/app/browser_profiles
    deploy:
      resources:
        limits:
          memory: 4G

  ollama:
    image: ollama/ollama:latest
    container_name: poob-ollama
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    # Local LLM is CPU-only (50-120s/call) and last-resort only. Hard-cap to 2
    # of 4 cores + a low weight so a stray fallback call can never monopolize
    # the box and starve the voice path during a VC. Fenced OUT of cores 0,1
    # (cpuset "2,3") so poob always has at least those 2 cores completely
    # clear of THIS contender specifically, no matter how hard it bursts —
    # poob itself is left unrestricted (see the poob service above), so this
    # is a one-way fence, not a shared partition: poob may still use 2,3 when
    # they're free, this container simply can never touch 0,1.
    cpu_shares: 256
    cpuset: "2,3"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 10G

  searxng:
    image: searxng/searxng:latest
    container_name: poob-searxng
    restart: unless-stopped
    volumes:
      - ../docker/searxng:/etc/searxng
    ports:
      - "8080:8080"
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  poob-data:
  poob-browser:
  ollama-data:
