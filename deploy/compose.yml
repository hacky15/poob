services:
  scraper:
    image: ghcr.io/hacky15/agenticwebscraper:latest
    container_name: agentic-scraper
    restart: unless-stopped
    env_file: .env
    depends_on:
      - ollama
      - searxng
    volumes:
      - scraper-data:/app/data
      - scraper-browser:/app/browser_profiles
    deploy:
      resources:
        limits:
          memory: 4G

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    deploy:
      resources:
        limits:
          memory: 10G

  searxng:
    image: searxng/searxng:latest
    container_name: agentic-searxng
    restart: unless-stopped
    volumes:
      - ../docker/searxng:/etc/searxng
    ports:
      - "8080:8080"
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  scraper-data:
  scraper-browser:
  ollama-data:
