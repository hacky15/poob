name: Build and push image

# Serialize builds per ref so the NEWEST commit is always the last to push
# :latest and fire the Komodo webhook.
#
# 2026-07-29: PRs #6 and #7 were merged 3 seconds apart. Both builds ran
# concurrently and both push ghcr.io/…/poob:latest, so the winner was decided
# by finish order, not commit order — and the OLDER commit won:
#
#   17:30:46.92  Komodo redeploy  sha=2b655b9  (newest commit)
#   17:30:49.97  Komodo redeploy  sha=96e3b22  (older commit, 3s later)
#
# :latest ended up pointing at code missing the newer merge while main said
# both were merged — silent version skew, the same class as a fix that never
# reaches production.
#
# cancel-in-progress is deliberately FALSE, not true. Cancelling would also
# fix the ordering, but this job pushes an image and fires a production deploy
# webhook; interrupting it mid-push or mid-webhook trades version skew for a
# half-applied deploy. Queueing costs one extra build on rapid merges and
# guarantees the newest ref finishes last.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    # Self-hosted containerized runners on the homelab. Migrated from
    # ubuntu-latest 2026-05-13 after the monthly $2 hosted-runner cap
    # was exhausted. See docs/decisions/self-hosted-runners-migration.md.
    # Two replicas register under the `poob` label set so this workflow
    # does not contend with permitscope's runners (which use `permitscope`).
    runs-on: [self-hosted, linux, x64, poob]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # docker/build-push-action defaults provenance:true, which adds an
          # extra `--attest type=provenance,...` export step. Combined with
          # cache-to type=registry,mode=max on this self-hosted runner, that
          # step hung indefinitely (2 back-to-back builds, byte-identical
          # stall at "exporting to image" / attestation, ~7min+ with zero
          # further log/network activity) — a known buildx friction point.
          # Poob's deploy doesn't consume provenance metadata; disabled at the
          # source rather than cancel-and-retrying forever. See
          # docs/gotchas/buildx-provenance-attestation-hangs.md.
          provenance: false
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/poob:latest
            ghcr.io/${{ github.repository_owner }}/poob:${{ github.sha }}
          # Registry cache (type=registry, mode=max) DISABLED 2026-07-03: a
          # 3rd stuck build (after the provenance fix above) showed the runner
          # reading a `reference for unknown type:
          # application/vnd.buildkit.cacheconfig.v0` from the registry
          # buildcache tag and hanging — almost certainly a corrupted cache
          # manifest left by an earlier cancelled mode=max push interrupted
          # mid-write. GHA cache alone is the fallback path and doesn't share
          # this registry-manifest fragility; kept as the sole cache. See
          # docs/gotchas/buildx-provenance-attestation-hangs.md.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Event-driven deploy trigger. Before this, build.yml only built+pushed,
      # so deploys rode Komodo's slow auto_update poll (non-deterministic, up to
      # ~hourly — see incidents/zombie-voice-connection-blocks-autojoin for how a
      # late deploy compounded an outage). The self-hosted runner is on the
      # homelab, so it reaches komodo-core via the docker host gateway and POSTs
      # the poob stack's Komodo webhook to pull+redeploy in ~1 min. HMAC-signed
      # (GitHub-style) with the stack's webhook secret. Non-fatal: the image is
      # already pushed; if the trigger misses, the poll is still the fallback.
      # See docs/decisions/komodo-deploy-trigger.md.
      - name: Trigger Komodo redeploy
        continue-on-error: true
        env:
          KOMODO_DEPLOY_URL: ${{ secrets.KOMODO_DEPLOY_URL }}
          KOMODO_WEBHOOK_SECRET: ${{ secrets.KOMODO_WEBHOOK_SECRET }}
        run: |
          body='{"ref":"refs/heads/main"}'
          sig=$(printf '%s' "$body" | openssl dgst -sha256 -hmac "$KOMODO_WEBHOOK_SECRET" | awk '{print $NF}')
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$KOMODO_DEPLOY_URL" \
            -H 'Content-Type: application/json' \
            -H 'X-GitHub-Event: push' \
            -H "X-Hub-Signature-256: sha256=$sig" \
            -d "$body")
          echo "Komodo /deploy -> HTTP $code"
          test "$code" = "200"
