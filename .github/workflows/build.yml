name: Build and push image

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/poob:latest
            ghcr.io/${{ github.repository_owner }}/poob:${{ github.sha }}
          # Registry cache is persistent across builds and not subject to
          # GHA cache's 10 GB / 7-day eviction policy. GHA cache is kept as
          # a fallback for the first build on a branch without a warm
          # registry cache yet.
          cache-from: |
            type=registry,ref=ghcr.io/${{ github.repository_owner }}/poob:buildcache
            type=gha
          cache-to: |
            type=registry,ref=ghcr.io/${{ github.repository_owner }}/poob:buildcache,mode=max
            type=gha,mode=max
