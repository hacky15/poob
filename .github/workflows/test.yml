name: Tests

# Why this exists: until 2026-07-26 the only workflow was build.yml
# (build + push to GHCR). Nothing ever ran the test suite, so a red test
# could sit on main indefinitely — test_music_tool_stays_under_budget was
# broken from b7d78cf until the 07-26 production audit stumbled on it, and
# a fully-built per-subsystem logging feature sat uncommitted while the
# poob-logs skill documented commands that could not work in production.
# Regressions were being caught by users in Discord instead of by CI.
#
# Runs on the self-hosted runners (same reason as build.yml: the monthly
# hosted-runner cap). See docs/gotchas/poob-deploy-frozen-by-dead-gha-runners.md
# if this job stops picking up jobs.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests + lint
    runs-on: [self-hosted, poob]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches the container (3.11 — openwakeword pulls tflite-runtime,
          # which still has no 3.12 wheels).
          python-version: "3.11"

      - name: Install (dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        # Non-blocking for now: the repo carries pre-existing findings that
        # predate this gate. It reports so new code is visible; flip to
        # blocking once the existing backlog is cleared.
        run: ruff check . || true

      - name: Ruff format check
        run: ruff format --check . || true

      # The gate that actually blocks. Unit tests only: integration/e2e need
      # live browsers, Discord, and provider credentials.
      - name: Unit tests
        run: pytest tests/unit -q --maxfail=5
