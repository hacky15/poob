[project]
name = "agentic-scraper"
version = "0.1.0"
description = "Autonomous deal-hunting bot using browser-use and LLM agents"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    # Browser automation
    "browser-use>=0.3.0",
    "playwright>=1.40.0",

    # LLM
    "langchain-core>=0.3.0",
    "langchain-ollama>=0.3.0",
    "langchain-google-genai>=2.1.0",

    # Discord
    "discord.py>=2.3.0",

    # Configuration
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",

    # Database
    "aiosqlite>=0.19.0",

    # HTTP
    "httpx>=0.25.0",

    # Logging
    "structlog>=23.2.0",

    # Utilities
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests",
    "e2e: marks end-to-end tests",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "SIM", "TCH"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[project.scripts]
scraper = "agentic_scraper.main:main"
